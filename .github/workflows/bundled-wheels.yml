name: mermaid-render distributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  release-version:
    name: Check release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Match version tag to package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match package version v{version}")
          PYTHON

  lightweight:
    name: Lightweight PyPI distributions
    needs: release-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python -m playwright install-deps chromium
      - run: uv run pytest -q
      - run: uv build --out-dir dist/pypi
      - run: uv run python scripts/check_lightweight_dist.py dist/pypi
      - run: uvx --from twine==7.0.0 twine check --strict dist/pypi/*
      - run: uv run python scripts/test_wheel_install.py --lightweight dist/pypi/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/pypi/*
          if-no-files-found: error

  wheels:
    name: ${{ matrix.name }}
    needs: release-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            tag: linux_x86_64
          - name: Windows x86-64
            os: windows-2022
            tag: win_amd64
          - name: macOS Apple Silicon
            os: macos-15
            tag: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            tag: macos-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Linux Chromium system libraries
        if: runner.os == 'Linux'
        run: |
          uv run python -m playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 fonts-liberation fonts-dejavu-core

      - name: Build wheel with Mermaid.js and Chromium Headless Shell
        shell: bash
        run: uv run python scripts/build_platform_wheel.py --outdir dist/bundled

      - name: Test installed wheel without browser/runtime downloads
        shell: bash
        run: uv run python scripts/test_wheel_install.py dist/bundled/*.whl

      - name: Test Linux wheel without host browser libraries or networking
        if: runner.os == 'Linux'
        run: uv run python scripts/test_linux_wheel.py dist/bundled/*.whl

      - name: Publish wheel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundled-${{ matrix.tag }}
          path: dist/bundled/*.whl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Attach wheels to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, lightweight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundled-*
          path: wheels
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: wheels
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/*.whl
            wheels/*.tar.gz
          fail_on_unmatched_files: true

  pypi:
    name: Publish lightweight distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'himbeles/mermaid-render'
    needs: [wheels, lightweight]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mermaid-render/
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: false
      - name: Download lightweight distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Publish with uv and PyPI Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
