name: mermaid-render distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built wheel to PyPI
        type: boolean
        default: false
      skip_macos:
        description: Skip macOS tests for this manual run
        type: boolean
        default: false
  push:
    branches: [main, pele]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Match release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - run: uv sync --locked
      - run: uv build --wheel --out-dir dist/pypi
      - run: uv run python scripts/check_distributions.py dist/pypi
      - run: uvx --from twine==7.0.0 twine check --strict dist/pypi/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/pypi/*.whl
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.skip_macos && '["ubuntu-24.04", "windows-2022"]' || '["ubuntu-24.04", "windows-2022", "macos-15"]') }}
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/pypi
      - name: Install and render the wheel
        shell: bash
        run: uv run python scripts/test_wheel_install.py dist/pypi/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

  pypi:
    if: github.repository == 'himbeles/mermaid-render' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mermaid-render/
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl
