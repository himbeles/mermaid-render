name: mermaid-render distributions

on:
  workflow_dispatch:
  push:
    branches: [main, pele]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Match release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - run: uv sync --locked
      - run: uv build --out-dir dist/pypi
      - run: uv run python scripts/check_distributions.py dist/pypi
      - run: uvx --from twine==7.0.0 twine check --strict dist/pypi/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/pypi/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/pypi
      - name: Download native dependency wheels for offline installation
        shell: bash
        run: uv run --with pip python -m pip download --only-binary=:all: --dest dist/wheelhouse dist/pypi/*.whl
      - name: Install and render offline with no browser or Node
        shell: bash
        run: uv run python scripts/test_wheel_install.py --wheelhouse dist/wheelhouse dist/pypi/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          path: offline
      - name: Package offline wheelhouses
        shell: bash
        run: |
          for folder in offline/*; do
            name=$(basename "$folder")
            (cd "$folder" && zip -j "../../dist/$name.zip" ./*.whl)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'himbeles/mermaid-render'
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mermaid-render/
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
