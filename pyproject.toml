[project]
name = "mermaid-render"
version = "0.7.2"
description = "Render Mermaid diagrams to SVG, PNG, PDF or connected Visio VSDX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Python port contributors" }]
keywords = ["mermaid", "visio", "vsdx", "svg", "png", "pdf", "diagram"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["playwright==1.63.0", "platformdirs>=4,<5", "filelock>=3.16,<4"]

[project.scripts]
mermaid-render = "mermaid_render.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermaid_render"]
exclude = ["**/browsers/**", "**/runtime/**"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = ["/src/mermaid_render/runtime/**", "/src/mermaid_render/browsers/**"]
include = ["/src", "/tests", "/examples", "/scripts", "/hatch_build.py", "/.python-version", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
