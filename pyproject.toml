[project]
name = "mermaid-render"
version = "0.14.1"
description = "Render Mermaid diagrams to SVG, PNG or connected Visio VSDX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Python port contributors" }]
keywords = ["mermaid", "visio", "vsdx", "svg", "png", "diagram"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["quickjs-ng==0.17.0.1", "resvg-py==0.5.0", "svgelements==1.9.6", "fonttools>=4.60,<5", "tinycss2>=1.4,<2", "cssselect2>=0.8,<1"]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]

[project.scripts]
mermaid-render = "mermaid_render.cli:main"
mermaid-render-mcp = "mermaid_render.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "mcp>=2.1,<3", "pillow>=11,<14"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "tests/**", "examples/**", "scripts/**", ".python-version", ".gitignore", ".gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
